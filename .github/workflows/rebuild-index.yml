name: Rebuild F-Droid index

# Resigns repo/index-v1.jar + entry.jar after metadata/icon changes.
# Requires repo secrets: FDROID_KEYSTORE_BASE64, FDROID_KEYSTORE_PASS
# (same values as on echoes-of-elysium / mooves-app release workflows).
on:
  workflow_dispatch:

concurrency:
  group: fdroid-rebuild-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install fdroidserver
        run: pip install 'fdroidserver==2.4.5'

      - name: Decode keystore + prep config
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${FDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret FDROID_KEYSTORE_BASE64 is not set on Klas96/fdroid"
            echo "Copy it from echoes-of-elysium (same PKCS12 used to sign this repo)."
            exit 1
          fi
          echo "$FDROID_KEYSTORE_BASE64" | base64 -d > keystore.p12
          chmod 600 keystore.p12
          sed -i -E \
            -e 's/^keystorepass:.*/keystorepass: {env: FDROID_KEYSTORE_PASS}/' \
            -e 's/^keypass:.*/keypass: {env: FDROID_KEYSTORE_PASS}/' config.yml
          chmod 600 config.yml

      - name: fdroid update
        env:
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: fdroid update

      - name: Clean up keystore / restore config
        if: always()
        run: |
          rm -f keystore.p12
          git checkout -- config.yml || true

      - name: Verify listing
        run: |
          python3 <<'PY'
          import json, zipfile
          d = json.load(open('repo/index-v1.json'))
          apps = {a.get('packageName'): a for a in d['apps']}
          assert 'com.contentcreator.app' not in apps, 'ContentCreator still in unsigned index'
          assert 'com.contentcreator.app' not in d['packages']
          # Repo icon.png was once mis-indexed as a fake "icon" package (sha256 id).
          fake_icon = '9deaf458823a105e790c34aade49ffcabaaec000a2da43633be5c5b6a7cb205a'
          assert fake_icon not in apps and fake_icon not in d['packages'], 'repo icon.png still listed as an app'
          assert not any((a.get('name') or '').lower() == 'icon' for a in d['apps']), 'app named icon still listed'
          tec = apps.get('com.tectonic.tectonic') or {}
          name = tec.get('name') or (tec.get('localized') or {}).get('en-US', {}).get('name')
          assert name == 'NumBlocks', f'tectonic name={name!r}'
          for pkg in ('com.keymatch.app', 'com.tectonic.tectonic', 'se.klasholmgren.echoesofelysium'):
            a = apps[pkg]
            loc = (a.get('localized') or {}).get('en-US') or {}
            assert loc.get('icon') or a.get('icon'), f'{pkg} missing icon in index-v1.json'
          with zipfile.ZipFile('repo/index-v1.jar') as z:
            signed = json.loads(z.read('index-v1.json'))
          assert 'com.contentcreator.app' not in signed['packages'], 'ContentCreator still in signed jar'
          assert fake_icon not in signed['packages'], 'fake icon package still in signed jar'
          print('OK: signed index has', sorted(signed['packages']))
          PY

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "fdroid rebuild-index CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          paths="repo metadata"
          for d in tmp archive; do [ -e "$d" ] && paths="$paths $d"; done
          git add -A -- $paths
          if git diff --cached --quiet; then
            echo "No index changes to commit"
            exit 0
          fi
          git commit -m "Rebuild signed F-Droid index [automated]"
          for i in 1 2 3; do
            git push origin HEAD:master && exit 0
            git pull --rebase origin master
          done
          exit 1
