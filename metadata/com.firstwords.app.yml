Name: First Words
Summary: Learn words with interactive flash cards — images, sounds, and text for kids.

Description: |
  First Words helps young learners pick up new words with interactive flash
  cards that combine text, images, and sounds.

  Create custom cards: add text, pick or take photos, record or choose audio.
  Browse a kid-friendly grid, swipe full-screen, and play each card's sound.
  Everything stays on the device — no account, no tracking, and core learning
  works offline.

  Free version includes a card limit; a one-time premium unlock removes it.

