Name: mooves
Summary: Record yourself dancing and see how on-beat your moves are.

Description: |
  mooves records you dancing, then analyzes how tightly your movement
  lines up with the music — entirely on your device.

  Pose tracking and beat detection run locally. Your video never leaves
  the phone. No account, no ads, no analytics SDK.

  Grant camera and microphone access when you want to capture a take,
  or pick an existing video from your library.

